name: todo_app
description: A quiet, local task list for iOS and Android.
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  dynamic_color: 1.8.1
  flutter_svg: ^2.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  in_app_purchase: 3.3.0
  intl: ^0.20.3
  characters: ^1.4.1
  share_plus: ^13.3.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/Android_Adaptive_Foreground.svg
    - assets/fonts/OFL-Geist.txt
    - assets/fonts/OFL-Parisienne.txt
    - assets/Own Assets/Setting_IconShape_Mask.svg
    - assets/Own Assets/MembershipCard Masks/
    - assets/Own Assets/Gradients/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: Parisienne
      fonts:
        - asset: assets/fonts/Parisienne-Regular.ttf
    - family: SometimeIcons
      fonts:
        - asset: assets/fonts/SometimeIcons.ttf
